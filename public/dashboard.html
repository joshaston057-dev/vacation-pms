<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Lead Portal | ResolveSync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

  <!-- Top Navigation -->
  <nav class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
      <span class="font-bold text-slate-900 tracking-tight">ResolveSync Lead Portal</span>
    </div>
    <button id="logoutBtn" onclick="logout()" class="hidden text-sm font-medium text-slate-500 hover:text-slate-900">
      Log Out
    </button>
  </nav>

  <!-- Login Screen -->
  <div id="loginSection" class="max-w-md mx-auto mt-16 px-4">
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">
      <h1 class="text-xl font-bold text-slate-900">Client Portal Access</h1>
      <p class="text-sm text-slate-500 mt-1 mb-6">Enter your Client ID and security PIN to view your live leads.</p>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Client ID</label>
          <input type="text" id="slugInput" required placeholder="e.g. wildedge-safaris"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-slate-900" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Access PIN</label>
          <input type="password" id="pinInput" required placeholder="••••"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-slate-900" />
        </div>

        <p id="loginError" class="text-xs text-red-600 hidden">Invalid Client ID or PIN. Please try again.</p>

        <button type="submit"
          class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl transition">
          Access Dashboard
        </button>
      </form>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboardSection" class="hidden max-w-6xl mx-auto px-4 py-8">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h2 id="clientTitle" class="text-2xl font-bold text-slate-900">Leads</h2>
        <p class="text-sm text-slate-500">Real-time inquiries captured from your landing page.</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="leadCount" class="px-3 py-1.5 bg-emerald-50 text-emerald-700 text-sm font-semibold rounded-lg border border-emerald-200">
          0 Leads
        </span>
        <button onclick="loadLeads()"
          class="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-sm font-medium rounded-lg transition">
          Refresh
        </button>
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500">
              <th class="py-3.5 px-6 font-semibold">Date</th>
              <th class="py-3.5 px-6 font-semibold">Prospect Name</th>
              <th class="py-3.5 px-6 font-semibold">Phone</th>
              <th class="py-3.5 px-6 font-semibold">Service / Interest</th>
              <th class="py-3.5 px-6 font-semibold">Notes</th>
              <th class="py-3.5 px-6 font-semibold text-right">Action</th>
            </tr>
          </thead>
          <tbody id="leadsTableBody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="6" class="py-8 text-center text-slate-400">Loading leads...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://cximzryicegrimqyspxe.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VS6Elsw0_NjPIMAjDOxhpw_fIfFy0vl';

    // Add each new client slug & PIN here
    const CLIENT_ACCESS = {
      'wildedge-safaris': '2026',
      'sparkle-clean': '4821'
    };

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let activeSlug = '';

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const slug = document.getElementById('slugInput').value.trim().toLowerCase();
      const pin = document.getElementById('pinInput').value.trim();
      const errorEl = document.getElementById('loginError');

      if (CLIENT_ACCESS[slug] && CLIENT_ACCESS[slug] === pin) {
        activeSlug = slug;
        errorEl.classList.add('hidden');
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.remove('hidden');
        document.getElementById('clientTitle').textContent = `${slug.toUpperCase()} — Lead Pipeline`;
        loadLeads();
      } else {
        errorEl.classList.remove('hidden');
      }
    });

    async function loadLeads() {
      const tableBody = document.getElementById('leadsTableBody');
      const countBadge = document.getElementById('leadCount');

      tableBody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-400">Fetching latest leads...</td></tr>';

      const { data, error } = await sb
        .from('leads')
        .select('*')
        .eq('client_slug', activeSlug)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Supabase fetch error:', error);
        tableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-red-500">Error loading leads: ${error.message}</td></tr>`;
        return;
      }

      countBadge.textContent = `${data.length} Lead${data.length === 1 ? '' : 's'}`;

      if (data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6" class="py-8 text-center text-slate-400">No leads captured yet for this client.</td></tr>';
        return;
      }

      tableBody.innerHTML = '';
      data.forEach((lead) => {
        const dateStr = lead.created_at ? new Date(lead.created_at).toLocaleDateString() : '—';
        const cleanPhone = (lead.phone || '').replace(/[^0-9]/g, '');
        const followUpMsg = encodeURIComponent(`Hi ${lead.full_name}, following up on your ${lead.service || 'inquiry'}!`);

        const row = `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-4 px-6 text-slate-500 whitespace-nowrap">${dateStr}</td>
            <td class="py-4 px-6 font-medium text-slate-900">${lead.full_name || '—'}</td>
            <td class="py-4 px-6 text-slate-600">${lead.phone || '—'}</td>
            <td class="py-4 px-6 text-slate-700">${lead.service || '—'}</td>
            <td class="py-4 px-6 text-slate-500 max-w-xs truncate">${lead.notes || '—'}</td>
            <td class="py-4 px-6 text-right whitespace-nowrap">
              <a href="https://wa.me/${cleanPhone}?text=${followUpMsg}" target="_blank"
                class="inline-flex items-center px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg transition">
                WhatsApp Follow-Up
              </a>
            </td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });
    }

    function logout() {
      activeSlug = '';
      document.getElementById('pinInput').value = '';
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    }
  </script>
</body>
</html>
